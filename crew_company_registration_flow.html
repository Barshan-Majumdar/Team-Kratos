
<style>
*{box-sizing:border-box;margin:0;padding:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.wrap{padding:1.5rem 0;max-width:680px}
.step-bar{display:flex;align-items:center;gap:0;margin-bottom:2rem}
.step-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative}
.step-item:not(:last-child)::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:1.5px;background:var(--border);z-index:0;transition:background .3s}
.step-item.done:not(:last-child)::after{background:var(--fill-accent)}
.step-circle{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--text-muted);position:relative;z-index:1;transition:all .2s}
.step-item.active .step-circle{border-color:var(--border-accent);background:var(--bg-accent);color:var(--text-accent)}
.step-item.done .step-circle{border-color:var(--fill-accent);background:var(--fill-accent);color:#fff}
.step-label{font-size:10px;color:var(--text-muted);text-align:center;line-height:1.3;max-width:70px}
.step-item.active .step-label{color:var(--text-accent);font-weight:500}
.step-item.done .step-label{color:var(--text-secondary)}

.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1.5rem}
.card-title{font-size:16px;font-weight:500;color:var(--text-primary);margin-bottom:4px}
.card-sub{font-size:13px;color:var(--text-secondary);margin-bottom:1.25rem;line-height:1.5}

.field{margin-bottom:1rem}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:5px}
.field label .req{color:var(--text-danger)}
.field input,.field select,.field textarea{width:100%;font-size:14px;padding:8px 10px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--surface-2);color:var(--text-primary);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--border-accent);box-shadow:0 0 0 3px var(--bg-accent)}
.field input.err,.field select.err,.field textarea.err{border-color:var(--border-danger)}
.err-msg{font-size:12px;color:var(--text-danger);margin-top:4px}
.field textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.divider{height:0.5px;background:var(--border);margin:1.25rem 0}

.dept-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;background:var(--surface-1);border:0.5px solid var(--border);font-size:12px;color:var(--text-secondary);cursor:pointer;transition:all .15s;margin:3px}
.dept-chip:hover{border-color:var(--border-strong)}
.dept-chip.sel{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
.dept-chip .x{font-size:10px;color:var(--text-muted)}

.role-builder{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden}
.role-row{display:grid;grid-template-columns:28px 1fr 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-bottom:0.5px solid var(--border);background:var(--surface-2)}
.role-row:last-child{border-bottom:none}
.role-row.locked{background:var(--surface-1)}
.role-row.header{background:var(--surface-1);padding:7px 12px}
.role-row.header span{font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.level-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0}
.lock-icon{font-size:13px;color:var(--text-muted)}
.add-role-row{display:flex;gap:8px;padding:10px 12px;background:var(--surface-1)}
.add-role-row input{flex:1;font-size:13px;padding:6px 9px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--surface-2);color:var(--text-primary);outline:none}
.add-role-row input:focus{border-color:var(--border-accent)}
.add-role-row select{font-size:13px;padding:6px 9px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--surface-2);color:var(--text-primary);outline:none}

.info-box{padding:10px 12px;border-radius:var(--radius);background:var(--bg-accent);border:0.5px solid var(--border-accent);font-size:13px;color:var(--text-accent);display:flex;gap:8px;align-items:flex-start;line-height:1.5;margin-bottom:1rem}
.warn-box{padding:10px 12px;border-radius:var(--radius);background:var(--bg-warning);border:0.5px solid var(--border-warning);font-size:13px;color:var(--text-warning);display:flex;gap:8px;align-items:flex-start;line-height:1.5;margin-bottom:1rem}

.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem}
.btn{padding:8px 18px;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-ghost{background:transparent;border:0.5px solid var(--border-strong);color:var(--text-secondary)}
.btn-ghost:hover{background:var(--surface-1)}
.btn-primary{background:var(--fill-accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{background:transparent;border:0.5px solid var(--border-danger);color:var(--text-danger)}
.btn-danger:hover{background:var(--bg-danger)}
.btn-sm{padding:5px 12px;font-size:12px}

.progress-note{font-size:12px;color:var(--text-muted);margin-top:.75rem;text-align:center}

.review-block{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:.75rem}
.review-hdr{padding:8px 12px;background:var(--surface-1);font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.review-cell{padding:8px 12px;border-bottom:0.5px solid var(--border);border-right:0.5px solid var(--border)}
.review-cell:nth-child(even){border-right:none}
.review-cell:last-child,.review-cell:nth-last-child(2):nth-child(odd){border-bottom:none}
.review-label{font-size:11px;color:var(--text-muted);margin-bottom:2px}
.review-val{font-size:13px;color:var(--text-primary);font-weight:500}

.role-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:500}
.rt-0{background:var(--bg-pro);color:var(--text-pro)}
.rt-1{background:var(--bg-accent);color:var(--text-accent)}
.rt-2{background:var(--bg-success);color:var(--text-success)}
.rt-3{background:var(--bg-warning);color:var(--text-warning)}
.rt-4{background:var(--surface-1);color:var(--text-secondary);border:0.5px solid var(--border)}

.success-wrap{text-align:center;padding:2rem 1rem}
.success-icon{width:56px;height:56px;border-radius:50%;background:var(--bg-success);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:24px;color:var(--fill-success)}
</style>

<div class="wrap">
<h2 class="sr-only">Crew HRMS company registration — multi-step form to set up your organisation, departments, and role hierarchy before onboarding employees</h2>

<div class="step-bar" id="stepBar"></div>
<div id="formBody"></div>
</div>

<script>
const STEPS=[
  {id:'company',label:'Company\ndetails'},
  {id:'structure',label:'Structure\n& depts'},
  {id:'roles',label:'Role\nhierarchy'},
  {id:'admin',label:'Your\naccount'},
  {id:'review',label:'Review\n& confirm'},
];

const DEPT_PRESETS=['Engineering','Product','Design','Marketing','Sales','Finance','HR','Operations','Legal','Customer Support','Data & Analytics','DevOps'];
const INDUSTRY_OPTS=['Technology / SaaS','Manufacturing','Healthcare','Retail / E-commerce','Financial Services','Education','Consulting / Services','Media & Entertainment','Logistics','Real Estate','Other'];
const SIZE_OPTS=['1–10','11–50','51–200','201–500','501–2000','2000+'];
const COUNTRY_OPTS=['India','United States','United Kingdom','Singapore','UAE','Germany','Canada','Australia','Other'];
const STATE_OPTS=['Andhra Pradesh','Bihar','Delhi','Gujarat','Haryana','Karnataka','Kerala','Maharashtra','Punjab','Rajasthan','Tamil Nadu','Telangana','Uttar Pradesh','West Bengal','Other'];

let step=0;
let data={
  company:{name:'',legalName:'',cin:'',pan:'',gstin:'',industry:'',size:'',website:'',founded:'',address:'',city:'',state:'',pincode:'',country:'India'},
  structure:{departments:[],customDept:''},
  roles:[
    {name:'Owner / Chairman',level:0,locked:true,canManage:'all',description:'Full platform access, registered the company'},
    {name:'HR Admin',level:1,locked:true,canManage:'below-1',description:'Full HR operations, manages all employees'},
    {name:'Manager',level:2,locked:true,canManage:'below-2',description:'Team-scoped approvals, views team data'},
    {name:'Employee',level:3,locked:true,canManage:'none',description:'Self-service, own data only'},
  ],
  newRole:{name:'',level:'2'},
  admin:{displayName:'',phone:'',designation:''},
  errors:{},
};

const LEVEL_COLORS=['rt-0','rt-1','rt-2','rt-3','rt-4'];
const LEVEL_LABELS={0:'L0',1:'L1',2:'L2',3:'L3',4:'L4',5:'L5'};

function validateStep(s){
  const errs={};
  if(s===0){
    const c=data.company;
    if(!c.name.trim()) errs.name='Company name is required';
    if(!c.legalName.trim()) errs.legalName='Legal / registered name is required';
    if(!c.pan.trim()) errs.pan='PAN is required';
    if(!c.industry) errs.industry='Select an industry';
    if(!c.size) errs.size='Select company size';
    if(!c.address.trim()) errs.address='Registered address is required';
    if(!c.city.trim()) errs.city='City is required';
    if(!c.state) errs.state='State is required';
    if(!c.pincode.trim()) errs.pincode='Pincode is required';
    else if(!/^\d{6}$/.test(c.pincode)) errs.pincode='Enter a valid 6-digit pincode';
    if(!c.country) errs.country='Country is required';
  }
  if(s===1){
    if(data.structure.departments.length===0) errs.departments='Add at least one department';
  }
  if(s===2){
    if(data.roles.length<2) errs.roles='At least 2 roles required';
  }
  if(s===3){
    if(!data.admin.displayName.trim()) errs.displayName='Your name is required';
    if(!data.admin.designation.trim()) errs.designation='Your designation is required';
    if(!data.admin.phone.trim()) errs.phone='Phone number is required';
    else if(!/^[6-9]\d{9}$/.test(data.admin.phone.replace(/\s/g,''))) errs.phone='Enter a valid 10-digit Indian mobile number';
  }
  data.errors=errs;
  return Object.keys(errs).length===0;
}

function field(id,label,type,val,placeholder,opts={}){
  const err=data.errors[id];
  const req=opts.required!==false;
  return `<div class="field">
    <label for="f_${id}">${label}${req?'<span class="req"> *</span>':''}</label>
    <input id="f_${id}" type="${type}" value="${val||''}" placeholder="${placeholder||''}" ${err?'class="err"':''} oninput="setField('${id}',this.value,'company')">
    ${err?`<div class="err-msg">${err}</div>`:''}
  </div>`;
}
function selectField(id,label,val,optArr,placeholder,model='company'){
  const err=data.errors[id];
  return `<div class="field">
    <label for="f_${id}">${label} <span class="req">*</span></label>
    <select id="f_${id}" ${err?'class="err"':''} onchange="setField('${id}',this.value,'${model}')">
      <option value="">${placeholder||'Select…'}</option>
      ${optArr.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
    </select>
    ${err?`<div class="err-msg">${err}</div>`:''}
  </div>`;
}

function renderStepBar(){
  document.getElementById('stepBar').innerHTML=STEPS.map((s,i)=>`
    <div class="step-item ${i<step?'done':i===step?'active':''}">
      <div class="step-circle">${i<step?'<i class="ti ti-check" style="font-size:12px"></i>':i+1}</div>
      <div class="step-label">${s.label.replace('\n','<br>')}</div>
    </div>`).join('');
}

function renderStep0(){
  const c=data.company;
  return `<div class="card">
    <div class="card-title">Company details</div>
    <div class="card-sub">Fill in all details about your organisation. Every field marked with an asterisk is required before you can proceed.</div>
    <div class="divider"></div>

    <div style="font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem">Basic information</div>
    ${field('name','Company display name','text',c.name,'e.g. Acme Technologies')}
    ${field('legalName','Legal / registered name','text',c.legalName,'e.g. Acme Technologies Private Limited')}
    <div class="grid2">
      ${selectField('industry','Industry',c.industry,INDUSTRY_OPTS,'Choose industry')}
      ${selectField('size','Company size',c.size,SIZE_OPTS,'Choose size')}
    </div>
    <div class="grid2">
      ${field('website','Website','url',c.website,'https://company.com',{required:false})}
      ${field('founded','Founded year','text',c.founded,'e.g. 2018',{required:false})}
    </div>

    <div class="divider"></div>
    <div style="font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem">Statutory & tax identifiers</div>
    <div class="grid2">
      ${field('pan','PAN','text',c.pan,'ABCDE1234F')}
      ${field('gstin','GSTIN','text',c.gstin,'22ABCDE1234F1Z5',{required:false})}
    </div>
    <div class="grid2">
      ${field('cin','CIN (if incorporated)','text',c.cin,'U12345DL2020PTC123456',{required:false})}
    </div>

    <div class="divider"></div>
    <div style="font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem">Registered address</div>
    ${field('address','Street address','text',c.address,'Building, street, area')}
    <div class="grid3">
      ${field('city','City','text',c.city,'e.g. Kolkata')}
      ${selectField('state','State',c.state,STATE_OPTS,'State','company')}
      ${field('pincode','Pincode','text',c.pincode,'700001')}
    </div>
    ${selectField('country','Country',c.country,COUNTRY_OPTS,'Country','company')}

    <div class="btn-row">
      <button class="btn btn-primary" onclick="nextStep()">Continue <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
    <div class="progress-note">Step 1 of 5 — nothing is saved until you complete all steps</div>
  </div>`;
}

function renderStep1(){
  const deps=data.structure.departments;
  return `<div class="card">
    <div class="card-title">Departments & structure</div>
    <div class="card-sub">Choose the departments that exist in your organisation. You can add custom ones too. At least one is required.</div>
    ${data.errors.departments?`<div class="warn-box"><i class="ti ti-alert-triangle" aria-hidden="true"></i>${data.errors.departments}</div>`:''}

    <div style="font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:.5rem">Preset departments</div>
    <div style="margin-bottom:1rem">${DEPT_PRESETS.map(d=>`<button class="dept-chip ${deps.includes(d)?'sel':''}" onclick="toggleDept('${d}')">${d}</button>`).join('')}</div>

    <div class="divider"></div>
    <div style="font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:.5rem">Add a custom department</div>
    <div style="display:flex;gap:8px">
      <input type="text" placeholder="e.g. Customer Experience" style="flex:1;font-size:14px;padding:8px 10px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--surface-2);color:var(--text-primary);outline:none" id="customDeptInput" value="${data.structure.customDept||''}" oninput="data.structure.customDept=this.value" onkeydown="if(event.key==='Enter')addCustomDept()">
      <button class="btn btn-ghost btn-sm" onclick="addCustomDept()">Add</button>
    </div>

    ${deps.length>0?`<div class="divider"></div>
    <div style="font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:.5rem">Your departments (${deps.length})</div>
    <div>${deps.map(d=>`<span class="dept-chip sel" onclick="toggleDept('${d}')">${d} <span class="x">×</span></span>`).join('')}</div>`:''}

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="prevStep()"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back</button>
      <button class="btn btn-primary" onclick="nextStep()">Continue <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
    <div class="progress-note">Step 2 of 5</div>
  </div>`;
}

function renderStep2(){
  const roles=data.roles;
  const customRoles=roles.filter(r=>!r.locked);
  const maxLevel=Math.max(...roles.map(r=>r.level));
  const levelOpts=[];
  for(let i=1;i<=maxLevel+1&&i<=5;i++) levelOpts.push(i);

  return `<div class="card">
    <div class="card-title">Role hierarchy</div>
    <div class="card-sub">These are your company's roles, ordered from highest to lowest authority. The four default roles are pre-set. Add custom roles — each can only invite or manage people below their own level.</div>

    <div class="info-box">
      <i class="ti ti-info-circle" aria-hidden="true" style="flex-shrink:0;margin-top:1px"></i>
      <span>The <strong>Owner / Chairman</strong> (Level 0) is the account that registers the company. They have unrestricted access to every feature and can manage all roles. This cannot be changed.</span>
    </div>

    <div class="role-builder">
      <div class="role-row header">
        <span></span><span>Role name</span><span>Level</span><span></span>
      </div>
      ${roles.map((r,i)=>`<div class="role-row ${r.locked?'locked':''}">
        <div class="level-badge ${LEVEL_COLORS[Math.min(r.level,4)]}" style="font-size:10px;font-weight:500">${LEVEL_LABELS[r.level]}</div>
        <div>
          <div style="font-size:13px;font-weight:500;color:var(--text-primary)">${r.name}${r.locked?'&nbsp;<i class="ti ti-lock" aria-hidden="true" style="font-size:11px;color:var(--text-muted)"></i>':''}</div>
          <div style="font-size:11px;color:var(--text-muted)">${r.description}</div>
        </div>
        <div style="font-size:12px;color:var(--text-secondary)">Level ${r.level}${r.level===0?' (highest)':r.level===Math.max(...roles.map(x=>x.level))?' (lowest)':''}</div>
        ${r.locked?'<div></div>':`<button class="btn btn-ghost btn-sm" onclick="removeRole(${i})" style="color:var(--text-danger);border-color:var(--border-danger)">Remove</button>`}
      </div>`).join('')}
      <div class="add-role-row">
        <input type="text" placeholder="New role name, e.g. Senior Developer" id="newRoleName" value="${data.newRole.name}" oninput="data.newRole.name=this.value">
        <select id="newRoleLevel" onchange="data.newRole.level=this.value">
          ${levelOpts.map(l=>`<option value="${l}" ${data.newRole.level==l?'selected':''}>Level ${l}</option>`).join('')}
        </select>
        <button class="btn btn-ghost btn-sm" onclick="addRole()"><i class="ti ti-plus" aria-hidden="true"></i> Add role</button>
      </div>
    </div>
    ${data.errors.roles?`<div class="err-msg" style="margin-top:6px">${data.errors.roles}</div>`:''}

    <div class="divider"></div>
    <div style="font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem">Invite rules enforced by the system</div>
    <div style="font-size:13px;color:var(--text-secondary);line-height:1.6">
      A person with a given role can only invite or create employees with roles at a <strong>higher level number</strong> (lower authority) than themselves. For example: an HR Admin (Level 1) can invite Managers (Level 2) and Employees (Level 3), but not another HR Admin or the Owner. The Owner can invite anyone at any level.
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="prevStep()"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back</button>
      <button class="btn btn-primary" onclick="nextStep()">Continue <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
    <div class="progress-note">Step 3 of 5</div>
  </div>`;
}

function renderStep3(){
  const a=data.admin;
  const ownerRole=data.roles.find(r=>r.level===0);
  return `<div class="card">
    <div class="card-title">Your account</div>
    <div class="card-sub">This is the founder account — the <strong>${ownerRole?ownerRole.name:'Owner / Chairman'}</strong>. You'll use your email (entered at sign-up) to log in. Fill in the remaining profile details below.</div>

    <div class="info-box">
      <i class="ti ti-shield-check" aria-hidden="true" style="flex-shrink:0;margin-top:1px"></i>
      <span>Your account is permanently the <strong>Level 0 / Owner</strong> role. It cannot be downgraded, transferred, or deleted without closing the company account.</span>
    </div>

    <div class="field">
      <label for="f_displayName">Your full name <span class="req">*</span></label>
      <input id="f_displayName" type="text" value="${a.displayName}" placeholder="e.g. Barshan Das" ${data.errors.displayName?'class="err"':''} oninput="data.admin.displayName=this.value">
      ${data.errors.displayName?`<div class="err-msg">${data.errors.displayName}</div>`:''}
    </div>
    <div class="grid2">
      <div class="field">
        <label for="f_designation">Your designation <span class="req">*</span></label>
        <input id="f_designation" type="text" value="${a.designation}" placeholder="e.g. CEO, Founder, Chairman" ${data.errors.designation?'class="err"':''} oninput="data.admin.designation=this.value">
        ${data.errors.designation?`<div class="err-msg">${data.errors.designation}</div>`:''}
      </div>
      <div class="field">
        <label for="f_phone">Mobile number <span class="req">*</span></label>
        <input id="f_phone" type="text" value="${a.phone}" placeholder="9800000000" maxlength="10" ${data.errors.phone?'class="err"':''} oninput="data.admin.phone=this.value">
        ${data.errors.phone?`<div class="err-msg">${data.errors.phone}</div>`:''}
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="prevStep()"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back</button>
      <button class="btn btn-primary" onclick="nextStep()">Review registration <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
    <div class="progress-note">Step 4 of 5</div>
  </div>`;
}

function renderStep4(){
  const c=data.company;
  const deps=data.structure.departments;
  const roles=data.roles;
  return `<div class="card">
    <div class="card-title">Review & confirm</div>
    <div class="card-sub">Review everything before registering. Once confirmed, your company workspace is created and cannot be renamed without contacting support.</div>

    <div class="warn-box">
      <i class="ti ti-alert-circle" aria-hidden="true" style="flex-shrink:0;margin-top:1px"></i>
      <span>After confirmation, quitting mid-registration will delete all progress. You'll need to start over.</span>
    </div>

    <div class="review-block">
      <div class="review-hdr">Company details</div>
      <div class="review-grid">
        <div class="review-cell"><div class="review-label">Display name</div><div class="review-val">${c.name||'—'}</div></div>
        <div class="review-cell"><div class="review-label">Legal name</div><div class="review-val">${c.legalName||'—'}</div></div>
        <div class="review-cell"><div class="review-label">Industry</div><div class="review-val">${c.industry||'—'}</div></div>
        <div class="review-cell"><div class="review-label">Size</div><div class="review-val">${c.size||'—'} employees</div></div>
        <div class="review-cell"><div class="review-label">PAN</div><div class="review-val">${c.pan||'—'}</div></div>
        <div class="review-cell"><div class="review-label">GSTIN</div><div class="review-val">${c.gstin||'—'}</div></div>
        <div class="review-cell"><div class="review-label">Location</div><div class="review-val">${c.city||'—'}, ${c.state||'—'} ${c.pincode||''}</div></div>
        <div class="review-cell"><div class="review-label">Country</div><div class="review-val">${c.country||'—'}</div></div>
      </div>
    </div>

    <div class="review-block">
      <div class="review-hdr">Departments (${deps.length})</div>
      <div style="padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px">
        ${deps.map(d=>`<span class="dept-chip sel" style="cursor:default">${d}</span>`).join('')}
      </div>
    </div>

    <div class="review-block">
      <div class="review-hdr">Role hierarchy (${roles.length} roles)</div>
      ${roles.sort((a,b)=>a.level-b.level).map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:0.5px solid var(--border)">
        <span class="role-tag ${LEVEL_COLORS[Math.min(r.level,4)]}">${LEVEL_LABELS[r.level]}</span>
        <span style="font-size:13px;font-weight:500;color:var(--text-primary);flex:1">${r.name}</span>
        ${r.locked?'<span style="font-size:11px;color:var(--text-muted)"><i class="ti ti-lock" style="font-size:10px"></i> system default</span>':'<span style="font-size:11px;color:var(--text-accent)">custom</span>'}
      </div>`).join('')}
    </div>

    <div class="review-block">
      <div class="review-hdr">Founder account</div>
      <div class="review-grid">
        <div class="review-cell"><div class="review-label">Name</div><div class="review-val">${data.admin.displayName||'—'}</div></div>
        <div class="review-cell"><div class="review-label">Designation</div><div class="review-val">${data.admin.designation||'—'}</div></div>
        <div class="review-cell"><div class="review-label">Mobile</div><div class="review-val">${data.admin.phone||'—'}</div></div>
        <div class="review-cell"><div class="review-label">Role</div><div class="review-val">Owner / Chairman (Level 0)</div></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="prevStep()"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back</button>
      <button class="btn btn-primary" onclick="register()" id="regBtn">Confirm & register company</button>

    <div class="progress-note">Step 5 of 5 — final step</div>
  </div>`;
}

function renderSuccess(){
  return `<div class="card success-wrap">
    <div class="success-icon"><i class="ti ti-building-skyscraper" aria-hidden="true"></i></div>
    <div style="font-size:18px;font-weight:500;color:var(--text-primary);margin-bottom:6px">${data.company.name} is registered</div>
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:1.5rem;line-height:1.6">Your company workspace is ready. You are signed in as <strong>${data.admin.displayName}</strong> with <strong>Owner / Chairman (Level 0)</strong> access. You can now invite your HR team, set up payroll, and configure offices.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1.5rem">
      <div style="background:var(--surface-1);border-radius:var(--radius);padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:500;color:var(--text-primary)">${data.structure.departments.length}</div>
        <div style="font-size:11px;color:var(--text-muted)">Departments</div>
      </div>
      <div style="background:var(--surface-1);border-radius:var(--radius);padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:500;color:var(--text-primary)">${data.roles.length}</div>
        <div style="font-size:11px;color:var(--text-muted)">Roles defined</div>
      </div>
      <div style="background:var(--surface-1);border-radius:var(--radius);padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:500;color:var(--text-primary)">1</div>
        <div style="font-size:11px;color:var(--text-muted)">Active member</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="sendPrompt('Now that my company is registered in Crew, what should I do next — invite HR, set up payroll config, or configure offices first?')">What should I do next? ↗</button>
  </div>`;
}

function render(){
  renderStepBar();
  const body=document.getElementById('formBody');
  if(step===0) body.innerHTML=renderStep0();
  else if(step===1) body.innerHTML=renderStep1();
  else if(step===2) body.innerHTML=renderStep2();
  else if(step===3) body.innerHTML=renderStep3();
  else if(step===4) body.innerHTML=renderStep4();
  else body.innerHTML=renderSuccess();
}

function setField(id,val,model){
  data[model][id]=val;
}
function nextStep(){
  if(!validateStep(step)){render();return;}
  step++;render();window.scrollTo(0,0);
}
function prevStep(){step--;data.errors={};render();}

function toggleDept(d){
  const i=data.structure.departments.indexOf(d);
  if(i>-1) data.structure.departments.splice(i,1);
  else data.structure.departments.push(d);
  render();
}
function addCustomDept(){
  const v=(data.structure.customDept||'').trim();
  if(!v)return;
  if(!data.structure.departments.includes(v)) data.structure.departments.push(v);
  data.structure.customDept='';
  render();
}

function addRole(){
  const name=(data.newRole.name||'').trim();
  const level=parseInt(data.newRole.level)||2;
  if(!name)return;
  if(data.roles.find(r=>r.name.toLowerCase()===name.toLowerCase()))return;
  data.roles.push({
    name,level,locked:false,
    canManage:`below-${level}`,
    description:`Custom role at level ${level} — can manage roles below level ${level}`
  });
  data.roles.sort((a,b)=>a.level-b.level);
  data.newRole={name:'',level:String(level)};
  render();
}
function removeRole(i){
  if(data.roles[i].locked)return;
  data.roles.splice(i,1);
  render();
}

function register(){
  const btn=document.getElementById('regBtn');
  if(btn){btn.disabled=true;btn.textContent='Registering…';}
  setTimeout(()=>{step=5;render();},1200);
}

render();
</script>
